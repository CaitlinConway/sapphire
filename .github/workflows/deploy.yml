name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * *' # nightly price refresh (07:17 UTC)
  workflow_dispatch:
    inputs:
      max_calls:
        description: 'Max Xotelo API calls this run'
        default: '8000'
      probe:
        description: 'Only test the price API with one hotel and print the responses'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

# Code pushes deploy right away instead of queueing behind a long price refresh.
concurrency:
  group: ${{ github.event_name == 'push' && 'deploy-push' || 'refresh' }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Rebuild hotels with fresh United route data
        run: REFRESH_ROUTES=1 node scripts/build_hotels.mjs
      - name: Refresh price estimates
        run: node scripts/fetch_prices.mjs
        env:
          MAX_CALLS: ${{ github.event.inputs.max_calls || '8000' }}
          PROBE: ${{ github.event.inputs.probe == 'true' && '1' || '' }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          TRIPADVISOR_KEY: ${{ secrets.TRIPADVISOR_KEY }}
      - name: Commit data
        # Always commit, so the RapidAPI usage counter survives a failed run.
        if: always() && github.event.inputs.probe != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data/*.json
          git diff --cached --quiet || git commit -m "Refresh hotel and price data"
          git push

  deploy:
    needs: refresh
    if: always() && github.event.inputs.probe != 'true' && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
