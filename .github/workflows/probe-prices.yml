name: Probe price API

on:
  pull_request:
    paths:
      - 'scripts/fetch_prices.mjs'
      - 'data/tripadvisor_overrides.json'
      - '.github/workflows/probe-prices.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Price one hotel with Xotelo
        run: PROBE=1 MAX_CALLS=10 node scripts/fetch_prices.mjs
      - name: Price the first 3 hotels (quick pass sample)
        run: |
          node -e 'const f="data/tripadvisor_overrides.json",j=require("./"+f);j.overrides=Object.fromEntries(Object.entries(j.overrides).slice(0,3));require("fs").writeFileSync(f,JSON.stringify(j))'
          MAX_CALLS=20 QUICK_DATES=2 DELAY_MS=300 node scripts/fetch_prices.mjs
