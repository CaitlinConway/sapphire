name: Probe price API

on:
  pull_request:
    paths:
      - 'scripts/fetch_prices.mjs'
      - '.github/workflows/probe-prices.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search and price one hotel
        run: PROBE=1 MAX_CALLS=10 node scripts/fetch_prices.mjs
        env:
          # No RapidAPI key here, so the probe never spends monthly searches.
          TRIPADVISOR_KEY: ${{ secrets.TRIPADVISOR_KEY }}
      - name: Wikidata TripAdvisor-id coverage
        run: node scripts/wikidata_probe.mjs
      - name: Xotelo CORS check
        run: curl -s -D - -o /dev/null -H "Origin: https://caitlinconway.github.io" "https://data.xotelo.com/api/rates?hotel_key=g35805-d9807749&chk_in=2026-11-19&chk_out=2026-11-21" | grep -i -E "^HTTP|access-control" || true
